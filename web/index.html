<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Welcome</title>
<link rel="stylesheet" href="greeting.css">
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #202335; background: #faf9fc; }
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(100% - 32px, 54rem); margin: clamp(2rem, 8vw, 6rem) auto; }
h1 { font-size: clamp(2rem, 7vw, 4rem); letter-spacing: -.055em; margin: 0 0 .65rem; }
main > p { color: #50536a; margin: 0 0 1.5rem; }
.greeting-surface { min-height: clamp(13rem, 48vw, 25rem); border-radius: 24px; margin-bottom: 1.5rem; padding: 1rem; }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1rem; }
.download, button {
  font: inherit;
  border: 1px solid #b4b4c6;
  border-radius: 12px;
  padding: .75rem 1rem;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.download { background: #282442; color: white; border-color: #282442; text-decoration: none; }
:focus-visible { outline: 3px solid #605acd; outline-offset: 3px; }
small { color: #50536a; line-height: 1.5; }
</style>
<main>
  <h1>GPT Welcome</h1>
  <p>让 ChatGPT 启动时写下一句手写欢迎语。</p>
  <div class="greeting-surface"><p class="greeting" role="img">welcome</p></div>
  <div class="actions">
    <a class="download" href="GPT-Welcome.zip" download>下载 macOS 版</a>
    <button id="replay" type="button">播放手写预览</button>
  </div>
  <small>支持 macOS 13 及以上。打开助手后，可在菜单栏选择 Welcome → 更改欢迎语…</small>
</main>
<script src="letter-strokes.js"></script>
<script src="greeting.js?v=2.2.0"></script>
<script>
const preview = document.querySelector(".greeting");
showGreeting(preview, defaultGreeting);
document.querySelector("#replay").addEventListener("click", () => animateGreeting(preview, defaultGreeting));
</script>
</html>
