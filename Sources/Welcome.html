<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Welcome</title>
<link rel="stylesheet" href="greeting.css">
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
.greeting-surface { width: 100%; height: 100%; }
</style>
<main class="greeting-surface"><p class="greeting" role="img"></p></main>
<script src="letter-strokes.js"></script>
<script src="hanzi-strokes.js"></script>
<script src="greeting.js"></script>
<script>
animateGreeting(document.querySelector(".greeting"), globalThis.welcomeGreeting ?? defaultGreeting)
  .then(() => window.webkit.messageHandlers.finished.postMessage(null));
</script>
</html>
